<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dyslexia PDF Reader</title>
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="stylesheet" href="src/css/opendyslexicfont.css">
</head>
<body>

  <div id="toolbar">
    <div class="toolbar-left">
      <button id="select-file"></button>
      <span id="file-path">No file selected</span>
      <input type="file" id="file-input" style="display: none;">
    </div>

    <div class="toolbar-center">
      <button id="prev-page"></button>
      <div class="page-counter">
        <input type="number" id="page-number" value="0" min="0">
        <span id="page-total">/ 0</span>
      </div>
      <button id="next-page"></button>
    </div>

    <div class="toolbar-right">
      <button id="zoom-in">+</button>
      <button id="zoom-out">-</button>
      <button id="toggle-dyslexia">Dyslexia Mode</button>
      <button id="toggle-bg">Toggle Background</button>
    </div>
  </div>

  <canvas id="pdf-canvas"></canvas>

  <script type="module" src="src/js/viewer.js"></script>
  <script type="module" src="src/js/dyslexia.js"></script>
</body>
</html>
